<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Define the character encoding. -->
    <meta charset="UTF-8">

    <!-- Make the interface responsive on different screen sizes. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Set the browser tab title. -->
    <title>Candidate Extractor</title>

    <style>
        /* Set the page's basic typography and background. */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            color: #1f2937;
        }

        /* Keep the application centered and readable. */
        main {
            max-width: 700px;
            margin: 60px auto;
            padding: 32px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        }

        /* Style the page heading. */
        h1 {
            margin-top: 0;
            margin-bottom: 8px;
        }

        /* Style the supporting description. */
        p {
            color: #6b7280;
        }

        /* Place the label above the textarea. */
        label {
            display: block;
            margin-top: 24px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        /* Style the candidate text input. */
        textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font: inherit;
            resize: vertical;
        }

        /* Style the extraction button. */
        button {
            margin-top: 16px;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        /* Slightly dim the button while hovering. */
        button:hover {
            opacity: 0.9;
        }

        /* Add spacing above the API result. */
        #result {
            margin-top: 24px;
        }

            /* Style the extracted candidate result card. */
            .result-card {
                padding: 20px;
                border: 1px solid #e5e7eb;
                border-radius: 10px;
                background: #f9fafb;
            }

            /* Add spacing below the result heading. */
            .result-card h2 {
                margin-top: 0;
            }

            /* Arrange candidate and monitoring details vertically. */
            .candidate-info,
            .monitoring-info {
                margin-top: 16px;
            }

            /* Display each result item as a clean label-value row. */
            .result-card p {
                display: flex;
                justify-content: space-between;
                gap: 20px;
                margin: 10px 0;
            }

            /* Keep result labels visually distinct from their values. */
            .result-card strong {
                color: #374151;
            }

        /* Style the loading message. */
        .loading {
            padding: 16px;
            text-align: center;
            color: #6b7280;
        }    
    </style>
</head>

<body>
    <!-- Main application container. -->
    <main>
        <h1>Candidate Extractor</h1>
        <p>Enter candidate information to extract structured data.</p>

        <!-- Candidate text input section. -->
        <label for="candidate-text">Candidate Information</label>

        <textarea
            id="candidate-text"
            rows="6"
            placeholder="Example: Jane Smith is a Data Analyst with 4 years of experience."
        ></textarea>

        <!-- Button that will trigger the API request. -->
        <button id="extract-button">Extract Candidate</button>

        <!-- Area where results or errors will be displayed. -->
        <section id="result"></section>
    </main>

    <script>
        // Get references to the interface elements.
        const candidateText = document.getElementById("candidate-text");
        const extractButton = document.getElementById("extract-button");
        const result = document.getElementById("result");

        // Send the candidate text to the FastAPI endpoint.
        extractButton.addEventListener("click", async () => {
            const text = candidateText.value.trim();

            // Require the user to enter candidate information.
            if (!text) {
                result.innerHTML = "<p>Please enter candidate information.</p>";
                return;
            }

            // Show a loading message while the API processes the request.
            result.innerHTML = '<p class="loading">Extracting candidate information...</p>';
            extractButton.disabled = true;
            extractButton.textContent = "Extracting...";

            try {
                // Send the candidate text to FastAPI.
                const response = await fetch("/extract-candidate", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ text: text })
                });

                // Convert the API response into JavaScript data.
                const data = await response.json();

                // Display the API error when the request fails.
                if (!response.ok) {
                    result.innerHTML = `<p>${data.detail}</p>`;
                    return;
                }

                // Display the extracted candidate information.
                result.innerHTML = `
                    <div class="result-card">
                        <h2>Extracted Candidate</h2>

                        <div class="candidate-info">
                            <p><strong>Name</strong><span>${data.candidate.name}</span></p>
                            <p><strong>Role</strong><span>${data.candidate.role}</span></p>
                            <p><strong>Experience</strong><span>${data.candidate.experience_years} years</span></p>
                        </div>

                        <div class="monitoring-info">
                            <p><strong>Latency</strong><span>${data.latency_seconds.toFixed(2)} seconds</span></p>
                            <p><strong>Estimated Cost</strong><span>$${data.estimated_cost_usd.toFixed(6)}</span></p>
                        </div>
                    </div>
                `;
            } catch (error) {
                // Handle network or unexpected frontend errors.
                result.innerHTML = "<p>Unable to connect to the API.</p>";
            } finally {
                // Re-enable the button after processing completes.
                extractButton.disabled = false;
                extractButton.textContent = "Extract Candidate";
            }
        });
    </script>

</body>
</html>
